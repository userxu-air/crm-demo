services:
  api:
    build: ../backend
    container_name: yuecrm-api
    restart: unless-stopped
    mem_limit: 600m # 内存天花板：异常泄漏只杀自己，不拖垮全机（mysqld/nginx 官网）
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg2://yuecrm:${POSTGRES_PASSWORD:?请在 deploy/.env 设置}@db:5432/yuecrm
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 设置 64 位随机串}
      INGEST_API_KEY: ${INGEST_API_KEY:?请在 deploy/.env 设置}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_DOCS: "0"
      SEED_ADMIN_PHONE: "${SEED_ADMIN_PHONE:-13800000001}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-Demo@2026}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads # 客户附件持久化（合同/交易明细）
    ports:
      - "127.0.0.1:8000:8000" # 仅本机监听，由 nginx 反代，绝不对公网

  db:
    image: postgres:16-alpine
    container_name: yuecrm-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: yuecrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置}
      POSTGRES_DB: yuecrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 注意：不写 ports = 数据库不对任何外网暴露，仅容器网络可达
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuecrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
