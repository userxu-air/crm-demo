# 宝塔 nginx 站点配置参考：crm.example.com
# 1) 前端执行 npm run build，将 dist/ 上传至 /www/wwwroot/crm.example.com/dist
# 2) 宝塔新建站点 crm.example.com（纯静态），粘贴本配置到「配置文件」
# 3) 宝塔 SSL 一键申请 Let's Encrypt 并开启「强制 HTTPS」

server {
    listen 80;
    server_name crm.example.com;
    root /www/wwwroot/crm.example.com/dist;
    index index.html;

    client_max_body_size 25m;  # 附件上限 20MB + 余量

    # API 反代到本机容器（compose 已限制仅 127.0.0.1 可达）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内部系统，禁搜索引擎
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
